[package]
name = "etebase-jni"
description = "JNI bindings to etebase-rs (Android and desktop JVM)"
homepage = "https://www.etebase.com"
repository = "https://github.com/etesync/etebase-java"
version = "2.3.1"
authors = ["Tom Hacohen <tom@stosb.com>"]
edition = "2018"
license = "BSD-3-Clause"
readme = "README.md"

[lib]
crate-type = ["cdylib"]

[build-dependencies]
flapigen = { git = "https://github.com/tasn/flapigen-rs", rev = "d2fbb9bd8ecb4ead986c295bffcfe889d9f47e8c" }
env_logger = "^0.7"

[dependencies]
log = "0.4.6"
log-panics = { version = "2.0", optional = true }
android_logger = { version = "0.8", optional = true }
jni-sys = "0.3.0"
etebase = { git = "https://github.com/etesync/etebase-rs", rev = "ff14aadd7d5bdefee084e8266f0d2642ed268834", default-features = false }


[features]
default = ["android"]
android = ["android_logger", "log-panics"]
jvm = []

[patch.crates-io]
remove_dir_all = { path = "patches/remove_dir_all" }
